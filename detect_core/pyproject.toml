[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detect-core"
version = "0.1.0"
description = "Kavach detection core: contracts, recognizers, validators, policy, pipeline"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7", "pyyaml>=6.0"]

[project.optional-dependencies]
llm = ["google-genai>=1.0", "langsmith>=0.3"]

[tool.setuptools]
packages = ["detect_core"]
